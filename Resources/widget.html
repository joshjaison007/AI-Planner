<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Task Widget</title>
    <style>
        :root {
            --primary: #8ab4f8;
            --accent: #c58af9;
            --text: #e8eaed;
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: rgba(0,0,0,0.01) !important;
            font-family: 'Google Sans', 'Inter', sans-serif;
            width: 100%;
            height: 100%;
        }

        body {
            -webkit-app-region: drag; /* Allows dragging the whole window */
        }

        #task-mini-player {
            width: 100vw;
            height: 100vh;
            background: #0f0f0f;
            border: 1px solid var(--glass-border);
            padding: 25px 15px;
            backdrop-filter: blur(25px);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .clock-container {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.02);
            border: 2px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
        }

        .time-inside {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px rgba(138, 180, 248, 0.4);
            z-index: 2;
            text-align: center;
            line-height: 1.1;
        }

        .progress-ring {
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.9;
            mask: radial-gradient(transparent 62%, black 63%);
            -webkit-mask: radial-gradient(transparent 62%, black 63%);
            transition: background 1s ease;
        }



        .hdd-info {
            font-size: 11px;
            color: var(--text);
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
    </style>
</head>
<body>


    <div id="task-mini-player">
        <div class="clock-container" onclick="if(window.pywebview && window.pywebview.api) window.pywebview.api.show_main_window()" style="cursor: pointer; -webkit-app-region: no-drag;" title="Click to open main window">
            <div class="progress-ring" id="progress-ring"></div>
            <div id="task-time-left" class="time-inside">--:--</div>
        </div>
        <div class="hdd-info" style="margin-bottom: 10px;">
            <div id="task-title" onclick="if(window.pywebview && window.pywebview.api) window.pywebview.api.show_main_window()" style="font-weight: bold; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 5px; font-size: 15px; cursor: pointer; -webkit-app-region: no-drag;" title="Click to open main window">Loading...</div>
            <div id="task-status" style="font-size: 10px; opacity: 0.6; letter-spacing: 1.5px; margin-top: 6px;">SYNCING</div>
            
            <div style="width: 90%; height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; margin: 15px auto 0 auto; overflow: hidden;">
                <div id="progress-bar" style="width: 0%; height: 100%; background: var(--primary); transition: width 0.5s ease;"></div>
            </div>
        </div>
    </div>

    <script>
        let googleEvents = [];

        async function syncEvents() {
            try {
                const res = await fetch('http://localhost:8000/api/events');
                googleEvents = await res.json();
                renderWidget();
            } catch (e) { console.error("Widget sync failed"); }
        }

        function renderWidget() {
            const now = new Date();
            let activeTask = googleEvents.find(e => {
                const start = new Date(e.start || e.start_time);
                const duration = e.duration || 60;
                const end = new Date(start.getTime() + duration * 60000);
                return now >= start && now <= end;
            });

            const displayTask = activeTask || {title: "Idle", duration: 0};
            
            let progress = 0;
            let timeLeftStr = "--:--";

            if (activeTask) {
                const start = new Date(activeTask.start || activeTask.start_time);
                const duration = activeTask.duration || 60;
                const end = new Date(start.getTime() + duration * 60000);
                const elapsed = (now - start) / 60000;
                progress = Math.min(100, Math.max(0, (elapsed / duration) * 100));

                const remainingMs = end - now;
                const totalSecs = Math.max(0, Math.floor(remainingMs / 1000));
                const h = Math.floor(totalSecs / 3600);
                const m = Math.floor((totalSecs % 3600) / 60);
                const s = totalSecs % 60;
                
                if (h > 0) {
                    timeLeftStr = `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                } else {
                    timeLeftStr = `${m}:${s.toString().padStart(2,'0')}`;
                }
            } else {
                const totalSecondsPassed = (now.getMinutes() * 60) + now.getSeconds();
                progress = (totalSecondsPassed / 3600) * 100;
                
                const secsLeft = 3600 - totalSecondsPassed;
                const m = Math.floor(secsLeft / 60);
                const s = secsLeft % 60;
                timeLeftStr = `${m}:${s.toString().padStart(2,'0')}`;
            }

            document.getElementById('task-title').innerText = displayTask.title;
            document.getElementById('task-time-left').innerText = timeLeftStr;
            document.getElementById('task-status').innerText = activeTask ? Math.round(progress) + '% COMPLETE' : 'HOUR PROGRESS';
            document.getElementById('progress-ring').style.background = `conic-gradient(var(--primary) ${progress}%, transparent 0)`;
            document.getElementById('progress-bar').style.width = progress + '%';
            

        }

        setInterval(syncEvents, 5000);
        setInterval(renderWidget, 1000);
        syncEvents();
    </script>
</body>
</html>
